<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Nafisa Mehzabin — Game of Thrones inspired developer banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="45%" stop-color="#11151a"/>
      <stop offset="78%" stop-color="#1b1115"/>
      <stop offset="100%" stop-color="#3c151c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#6f5418"/>
      <stop offset="50%" stop-color="#d0aa45"/>
      <stop offset="100%" stop-color="#6f5418"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfc3c7" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#bfc3c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#sky)"/>

  <!-- cold northern mist -->
  <ellipse cx="320" cy="285" rx="420" ry="85" fill="url(#mist)" filter="url(#soft)"/>
  <ellipse cx="1240" cy="295" rx="430" ry="90" fill="url(#mist)" filter="url(#soft)"/>

  <!-- mountain layers -->
  <path d="M0 355 L155 210 L250 300 L365 175 L520 355 Z" fill="#0c1014"/>
  <path d="M365 355 L545 205 L675 315 L795 190 L950 355 Z" fill="#0f1318"/>
  <path d="M825 355 L1005 185 L1115 290 L1265 150 L1450 355 Z" fill="#0b0f13"/>
  <path d="M1190 355 L1360 205 L1600 355 Z" fill="#11151a"/>

  <!-- Winterfell-like fortress silhouette -->
  <g fill="#080b0f">
    <rect x="0" y="345" width="1600" height="155"/>
    <rect x="140" y="305" width="86" height="92"/>
    <rect x="176" y="265" width="18" height="48"/>
    <polygon points="175,265 185,245 195,265"/>
    <rect x="1280" y="295" width="92" height="105"/>
    <rect x="1316" y="250" width="20" height="54"/>
    <polygon points="1315,250 1326,228 1337,250"/>
    <rect x="285" y="325" width="54" height="74"/>
    <rect x="1160" y="320" width="58" height="80"/>
  </g>

  <!-- raven silhouette -->
  <g transform="translate(235 125) scale(1.05)" fill="#020304" opacity=".92">
    <path d="M0 30 C32 4,66 8,88 23 C67 18,53 21,39 33 C61 29,78 37,92 54 C67 42,44 43,20 56 C24 44,18 35,0 30Z"/>
    <path d="M84 22 L115 8 L100 28 Z"/>
  </g>

  <!-- distant dragon silhouette -->
  <g transform="translate(1260 100)" fill="#050608" opacity=".88">
    <path d="M0 32 C34 9,64 14,90 31 C118 10,145 9,174 24 C145 24,128 34,110 48 C136 52,155 68,170 87 C135 70,108 65,82 67 C56 66,31 73,0 89 C18 68,34 51,55 44 C35 42,18 38,0 32Z"/>
    <path d="M80 67 L72 94 L90 73 Z"/>
  </g>

  <!-- subtle sword -->
  <g transform="translate(800 76)">
    <rect x="-2.5" y="0" width="5" height="86" rx="2.5" fill="url(#gold)" opacity=".9"/>
    <polygon points="0,-15 7,4 -7,4" fill="#d0aa45"/>
    <rect x="-25" y="78" width="50" height="5" rx="2.5" fill="#78313c"/>
  </g>

  <!-- title -->
  <text x="800" y="188" text-anchor="middle" fill="#f0e8db"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="60" letter-spacing="8">
    NAFISA MEHZABIN
  </text>

  <text x="800" y="232" text-anchor="middle" fill="#9ea4aa"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">
    @thevintagecoder
  </text>

  <line x1="470" y1="262" x2="1130" y2="262" stroke="url(#gold)" stroke-width="1.5" opacity=".85"/>

  <text x="800" y="307" text-anchor="middle" fill="#d0aa45"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700" letter-spacing="7">
    CODE • READ • LIFT • REPEAT
  </text>

  <text x="800" y="346" text-anchor="middle" fill="#8e949a"
        font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="4">
    DEVELOPER • WRITER • BUILDER
  </text>

  <text x="800" y="389" text-anchor="middle" fill="#6f747b"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
    The North remembers. The commits do too.
  </text>

  <rect x="1" y="1" width="1598" height="498" fill="none" stroke="#5f4022" stroke-width="2" opacity=".72"/>
</svg>
