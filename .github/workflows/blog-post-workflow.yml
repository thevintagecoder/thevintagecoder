name: Latest Blog Posts

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest Medium posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest Medium posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@YOUR_MEDIUM_USERNAME"
          max_post_count: 4
          template: "- [$title]($url) &nbsp;<sub>$date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "chore: update latest Medium articles"
